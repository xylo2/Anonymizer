[files]
csv_directory = export_contacts
csv_prefixes = contacts, autres contacts
first_names_file = prenoms.txt
output_file = contacts_indexes.txt
anonymized_output_file = contacts_anonymises.txt
deduplicated_output_file = contacts_dedoublonnes.txt
inverted_output_file = contacts.txt
encoding = utf-8-sig

[formatting]
clean_phone_spaces = false
lowercase_emails = true
separator = =
merge_separator = et

[anonymizer]
ignored_domains = gmail, yahoo, hotmail, outlook, orange, free, sfr, laposte, icloud, iclore, mailo, msn, wanadoo, live
entity_prefixes = la, le, les, l, un, une, des, du, au, aux, chez
company_keywords = communication, consulting, services, sarl, sas, agence, studio
extra_locations = Paris, Lyon, Marseille, Toulouse, Bordeaux, Lille, Nantes

[domain_aliases]
credit-cooperatif = Crédit Coopératif

[paths]
root_dir = .
contacts_file = contacts.txt
all_sms_numbers_file = tous_numeros_sms.txt
all_emails_file = tous_emails_trouves.txt
sources_dir = fichiers sources
transcriptions_dir = transcriptions
results_dir = resultats_anonymisation
audit_report_file = audit_noms_residuels.txt

[extraction]
enable_ocr = true
enable_audio = true
whisper_model = base
ignored_dirs = transcriptions, resultats_anonymisation, venv, .venv, .git, __pycache__

[anonymization]
main_character_name = Personnage_Principal
file_prefix = anonymise_
secret_salt = REMPLACER_PAR_UNE_CHAINE_ALEATOIRE_UNIQUE
max_batch_bytes = 184320
files_per_folder = 10
min_audit_occurrences = 1
mask_ssn = true
mask_addresses = true
mask_financial_and_admin_ids = true
excluded_words = le, la, les, un, une, des, du, de, d, au, aux, ce, cet, cette, ces, mon, ma, mes, ton, ta, tes, son, sa, ses, notre, nos, votre, vos, leur, leurs, il, elle, ils, elles, on, nous, vous, je, tu, qui, que, quoi, dont, ou, mais, et, donc, or, ni, car, pour, dans, par, sur, avec, sans, sous, vers, chez, entre, depuis, pendant, avant, apres, selon, malgre, lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche, janvier, fevrier, mars, avril, mai, juin, juillet, aout, septembre, octobre, novembre, decembre, madame, monsieur, mademoiselle, docteur, professeur, maitre, bonjour, bonsoir, salut, coucou, cordialement, merci, objet, date, page, document, france, bilan, compte, rendu, ordonnance, certificat, medical, medicale, securite, sociale, assurance, maladie, hopital, clinique, polyclinique, centre, service, consultation, examen, resultat, resultats, conclusion, suite, note, attention, total, fait, image, photo, capture, contenu, fin, message, audio, diapositive, presentation, feuille, classeur, texte, word, excel, caisse, nationale, organisme, complementaire, mutuelle, pharmacien, pharmacie, laboratoire, biologie, hematologie, hemostase, analyse, analyses, facture, attestation, arret, travail, accident, trajet, professionnelle, medecin, traitant, generaliste, pediatre, psychologue, psychiatre, dentiste, orthodontiste, ophtalmologue, chirurgien, anesthesiste, infirmier, infirmiere, kinesitherapeute, orthoptiste, conseil, direction, ressources, humaines, inspection, syndicat, reunion, projet, renovation, bureau, etudes, produit, equipe, gestion, suivi, dossier, piece, jointe, copie, conforme, signature, cachet, nom, prenom, adresse, code, postal, ville, telephone, portable, courriel, email, mail, oui, non, ne, pas, plus, tres, bien, bon, bonne, nouveau, nouvelle, ancien, ancienne, premier, premiere, deuxieme, troisieme, jan, feb, mar, apr, may, jun, jul, aug, sep, oct, nov, dec, mon, tue, wed, thu, fri, sat, sun, cet, cest, gmt, utc, from, to, cc, subject