[files]
csv_directory = input_contacts
csv_prefixes = contacts, autres contacts
first_names_file = data/prenoms.txt
suggested_first_names_file = output_contacts/.intermediates/suggested_first_names.txt
locations_file = data/villes_masquees.txt
surname_collisions_file = data/collisions_noms.txt
excluded_words_file = data/mots_exclus.txt
output_file = output_contacts/.intermediates/indexed_contacts.txt
anonymized_output_file = output_contacts/.intermediates/anonymized_contacts.txt
surnames_output_file = output_contacts/.intermediates/contact_surnames.txt
deduplicated_output_file = output_contacts/.intermediates/deduplicated_contacts.txt
inverted_output_file = output_contacts/contacts.txt
encoding = utf-8-sig

[formatting]
clean_phone_spaces = false
lowercase_emails = true
separator = =
merge_separator = et

[anonymizer]
ignored_domains = gmail, yahoo, hotmail, outlook, orange, free, sfr, laposte, icloud, iclore, mailo, msn, wanadoo, live
entity_prefixes = la, le, les, l, un, une, des, du, au, aux, chez
company_keywords = communication, consulting, services, sarl, sas, agence, studio
extra_locations = Paris, Lyon, Marseille, Toulouse, Bordeaux, Lille, Nantes

[domain_aliases]
credit-cooperatif = Crédit Coopératif

[paths]
root_dir = .
contacts_file = output_contacts/contacts.txt
surnames_contacts_file = output_contacts/.intermediates/contact_surnames.txt
manual_contacts_file = output_contacts/manual_contacts.txt
discovered_contacts_file = output_contacts/discovered_email_contacts.txt
discovered_chats_file = output_contacts/discovered_chat_contacts.txt
all_sms_numbers_file = audits/all_sms_numbers.txt
all_emails_file = audits/all_found_emails.txt
sources_dir = input_documents
transcriptions_dir = extracted_texts
results_dir = anonymized_results
audit_report_file = audits/residual_names_audit.txt
audit_copy_file = audits/residual_names_copy.txt
extraction_report_file = audits/extraction_report.txt

[extraction]
enable_ocr = true
enable_audio = true
ignore_google_chat_images = true
whisper_model = base
defer_heavy_files = true
heavy_file_threshold_mb = 25.0
extraction_workers = 0
ignored_dirs = extracted_texts, anonymized_results, output_contacts, audits, data, docs, venv, .venv, .git, __pycache__, common, tools, tests

[anonymization]
main_character_name = Personnage_Principal
file_prefix = anonymized_
secret_salt = REMPLACER_PAR_UNE_CHAINE_ALEATOIRE_UNIQUE
max_batch_bytes = 184320
files_per_folder = 10
min_audit_occurrences = 1
mask_ssn = true
mask_addresses = true
mask_urls = true
mask_financial_and_admin_ids = true
masked_birth_dates =
